# LD3-D Configuration: SEDD on text8
# Model: SEDD (Score Entropy Discrete Diffusion)
# Dataset: text8
# Reference: Lou et al. (ICML 2024 Best Paper)

# === Model ===
model_type: sedd
diffusion_type: uniform  # SEDD uses uniform noise
vocab_size: 27
seq_length: 256
ckp_path: null  # Path to pre-trained SEDD checkpoint

# === Noise Schedule ===
noise_schedule: log_linear
T: 1.0
eps: 1e-4

# === Solver ===
solver_name: tau_leaping
steps: 64
teacher_steps: 1024
skip_type: rate_uniform  # Uniform in rate-integral space

# === LD3-D Training ===
time_mode: rate_integral  # Optimize in rate-integral space (analogous to logSNR)
loss_type: cross_entropy
theory_proxy_weight: 0.005
temperature: 1.0

# Learning rates
lr_time_1: 0.005
lr_time_2: 0.1
min_lr_time_1: 5e-5
min_lr_time_2: 1e-6
lr_time_decay: 0.8
momentum_time_1: 0.9
win_rate: 0.5

# Training rounds
training_rounds_v1: 3
training_rounds_v2: 5
patient: 5
lr2_patient: 5

# Data
data_dir: data/discrete_teacher/sedd_text8
num_train: 50
num_valid: 25
train_batch_size: 8
valid_batch_size: 8

# Output
snapshot_path: logs/discrete/sedd_text8
